        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { main } = require(path.join(actionsDir, 'validate_recovery_envelopes.cjs'));
            main({ core, additionalRoots: JSON.parse(process.env.GH_AW_RECOVERY_ADDITIONAL_ROOTS) });
      # Small dedicated copy of the agent output so safe-output processing

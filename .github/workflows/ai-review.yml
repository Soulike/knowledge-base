name: AI review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - converted_to_draft
      - closed

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review with Copilot CLI
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.action != 'closed' &&
        github.event.action != 'converted_to_draft' &&
        contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.pull_request.author_association
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out trusted review tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up latest Node.js LTS
        uses: actions/setup-node@v7
        with:
          check-latest: true
          node-version: "lts/*"

      - name: Install latest Copilot CLI and Skills CLI
        run: npm install --global "@github/copilot@latest" "skills@latest"

      - name: Install trusted knowledge-base plugin
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot plugin marketplace add "$GITHUB_WORKSPACE"
          copilot plugin install knowledge-base@knowledge-base
          copilot plugin list

      - name: Install review reference Skills
        run: >-
          skills add mattpocock/skills
          --global
          --agent github-copilot
          --skill codebase-design tdd writing-for-agents
          --copy
          --yes
          --full-depth

      - name: Run and publish one integrated review
        env:
          AI_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'auto' }}
          AI_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          AI_REVIEW_REASONING_EFFORT: ${{ vars.AI_REVIEW_REASONING_EFFORT || 'auto' }}
          AI_REVIEW_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          AI_REVIEW_RUN_ID: ${{ github.run_id }}
          AI_REVIEW_TOOLING_SHA: ${{ github.event.pull_request.base.sha }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review/run-review.ts

  gate:
    name: AI review gate
    if: ${{ always() }}
    needs:
      - review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted gate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up latest Node.js LTS
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          check-latest: true
          node-version: "lts/*"

      - name: Install trusted gate dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify review, update verdict label, and enforce verdict
        env:
          AI_REVIEW_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AI_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AI_REVIEW_EVENT_ACTION: ${{ github.event.action }}
          AI_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_JOB_RESULT: ${{ needs.review.result }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'auto' }}
          AI_REVIEW_PR_DRAFT: ${{ github.event.pull_request.draft }}
          AI_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          AI_REVIEW_REASONING_EFFORT: ${{ vars.AI_REVIEW_REASONING_EFFORT || 'auto' }}
          AI_REVIEW_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          AI_REVIEW_RUN_ID: ${{ github.run_id }}
          AI_REVIEW_TOOLING_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review/gate.ts

name: Plugin installation smoke test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: codex
            package: "@openai/codex@latest"
          - client: copilot
            package: "@github/copilot@latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up latest Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Install ${{ matrix.client }} CLI
        run: npm install --global "${{ matrix.package }}"

      - name: Install every plugin with ${{ matrix.client }}
        run: node .github/scripts/smoke-plugin-install/index.ts "${{ matrix.client }}"

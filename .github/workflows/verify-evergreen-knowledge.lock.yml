          GH_AW_EXPR_7C248226: ${{ github.event.issue.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'issue' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_EXPR_C19C384F: ${{ github.event.discussion.number || (fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_type == 'discussion' && fromJSON(steps.generate_aw_info.outputs.aw_context || '{}').item_number) }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: |-
            - `github` — run `github --help` to see available tools
            - `safeoutputs` — run `safeoutputs --help` to see available tools
            - `tavily` — run `tavily --help` to see available tools
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Validate prompt placeholders
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
        env:
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Print prompt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
        env:
          GH_AW_OTLP_ENDPOINTS: ""
          GH_AW_OTLP_IF_MISSING: ""
          GH_AW_OTLP_LOGS_ENABLED: ""
          GH_AW_OTLP_LOGS_MAX_BYTES: ""
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
          OTEL_EXPORTER_OTLP_PROTOCOL: ""
          OTEL_RESOURCE_ATTRIBUTES: ""
          OTEL_SERVICE_NAME: ""
      - name: Inventory installed skills
        if: success() || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'skill_inventory.cjs'));
            await main();
      - name: Upload info artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: info
          path: /tmp/gh-aw/aw_info.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/system.txt
            /tmp/gh-aw/aw-prompts/user.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/aw-prompts/prompt-literal-values.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
            /tmp/gh-aw/skill_inventory.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '1' }}

  add_finding:
    name: add_finding
    needs:
      - agent
      - detection
    if: >
      (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'add_finding') &&
      needs.detection.result == 'success'
    runs-on: ubuntu-latest
    # Permissions for the add_finding job (workflow permissions default to none).
    permissions:
      contents: read
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/verify-evergreen-knowledge"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_DETECTION_THREAT_KINDS: ${{ needs.detection.outputs.detection_threat_kinds }}
      GH_AW_ENGINE_ID: "copilot"
      GH_AW_ENGINE_MODEL: "${{ vars.CONTENT_VERIFICATION_MODEL || 'auto' }}"
      GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
      GH_AW_OBJECT_PACK_MAX_BYTES: ${{ vars.GH_AW_OBJECT_PACK_MAX_BYTES }}
      GH_AW_OBJECT_PACK_MAX_OBJECTS: ${{ vars.GH_AW_OBJECT_PACK_MAX_OBJECTS }}
      GH_AW_OBJECT_PACK_TIMEOUT_MS: ${{ vars.GH_AW_OBJECT_PACK_TIMEOUT_MS }}
      GH_AW_RUN_DETECTION: ${{ needs.detection.outputs.run_detection }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "verify-evergreen-knowledge"
      GH_AW_WORKFLOW_NAME: "Verify evergreen Knowledge"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/verify-evergreen-knowledge.md"
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - name: Record add-finding events
        run: ":"
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}

  agent:
    name: agent
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    # Permissions for the agent job (workflow permissions default to none).
    permissions:
      actions: read # Read workflow runs and artifacts for workflow context.
      attestations: read # Read artifact attestations for workflow context.
      checks: read # Read check runs for workflow context.
      code-quality: read # Read code quality results for workflow context.
      contents: read
      copilot-requests: write # Authenticate requests to the Copilot engine.
      deployments: read # Read deployments for workflow context.
      discussions: read # Read discussions and comments for workflow context.
      drives: read # Read persistent drive memory for workflow context.
      issues: read # Read issues and comments for workflow context.
      models: read # Read AI models for workflow context.
      packages: read # Read packages for workflow context.
      pages: read # Read GitHub Pages deployments for workflow context.
      pull-requests: read # Read pull requests and review comments for workflow context.
      repository-projects: read # Read repository projects for workflow context.
      security-events: read # Read code scanning results for workflow context.
      statuses: read # Read commit statuses for workflow context.
      vulnerability-alerts: read # Read vulnerability alerts for workflow context.
    cache-mode: read
    concurrency:
      group: "gh-aw-copilot-${{ github.workflow }}"
      queue: max
    timeout-minutes: 75
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
      GH_AW_OBJECT_PACK_MAX_BYTES: ${{ vars.GH_AW_OBJECT_PACK_MAX_BYTES }}
      GH_AW_OBJECT_PACK_MAX_OBJECTS: ${{ vars.GH_AW_OBJECT_PACK_MAX_OBJECTS }}
      GH_AW_OBJECT_PACK_TIMEOUT_MS: ${{ vars.GH_AW_OBJECT_PACK_TIMEOUT_MS }}
      GH_AW_PR_HEAD_BASE_BRANCH: ""
      GH_AW_PR_HEAD_BASE_PR_NUMBER: ""
      GH_AW_PR_HEAD_BASE_REF: ""
      GH_AW_PR_HEAD_BASE_REPO: ""
      GH_AW_PR_HEAD_BASE_SHA: ""
      GH_AW_PR_HEAD_REPO: ""
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_TARGET_REPO_SLUG: ""
      GH_AW_WORKFLOW_ID_SANITIZED: verifyevergreenknowledge
      PLAYWRIGHT_MCP_SANDBOX: false
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-token-usage.outputs.aic }}
      ambient_context: ${{ steps.parse-token-usage.outputs.ambient_context }}
      checkout_pr_invalidated: ${{ steps.checkout-pr.outputs.checkout_pr_invalidated || 'false' }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_endpoint_mismatch_error: ${{ steps.detect-agent-errors.outputs.model_endpoint_mismatch_error || 'false' }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      shell_expansion_guard_rejected: ${{ steps.detect-agent-errors.outputs.shell_expansion_guard_rejected || 'false' }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw/actions/setup@399a445fe2d8926c616b54b1b82a16b5b2be4445 # 399a445fe2d8926c616b54b1b82a16b5b2be4445
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Verify evergreen Knowledge"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/verify-evergreen-knowledge.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.103"
          GH_AW_INFO_AWF_VERSION: "v0.29.11"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        env:
          GH_AW_RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: | # zizmor: ignore[github-env] - runner.tool_cache is set by GitHub Actions, not user input.
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${GH_AW_RUNNER_TOOL_CACHE}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Check OTLP telemetry configuration
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_otlp_default_credentials.sh"
      - name: Checkout repository (gh-aw default)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize agent execution evidence
        run: |
          mkdir -p "/tmp/gh-aw"
          evidence_tmp="/tmp/gh-aw/agent_execution.json.tmp"
          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Configure Git credentials
        env:
          GH_AW_GIT_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh" 1.0.103 --checksums-sha256 26cd3e4b32cde498e4961fb4d48e7b85d7859fc69af1a645a19201fdd577bdb2 --prefer-toolcache --cooldown-days 3
        env:
          GH_HOST: github.com
          GITHUB_TOKEN: ${{ github.token }}
          GH_AW_COPILOT_MIN_VERSION: 1.0.35
      - name: Install AWF binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.29.11 --rootless
      - name: Install Playwright CLI
        run: npm install -g @playwright/cli@0.1.23
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: '3'
        timeout-minutes: 10
      - name: Install Playwright browsers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_playwright_browsers.sh" chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gh-aw/playwright-browsers
        timeout-minutes: 10
      - name: Install Playwright CLI skills
        run: playwright-cli install --skills
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gh-aw/playwright-browsers
        timeout-minutes: 10
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
          GH_AW_GITHUB_MIN_INTEGRITY: 'approved'
          GH_AW_GITHUB_REPOS: 'all'
          GH_AW_PRIVATE_TO_PUBLIC_FLOWS: 'allow'
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Parse integrity filter lists
        id: parse-guard-vars
        env:
          GH_AW_BLOCKED_USERS_VAR: ${{ vars.GH_AW_GITHUB_BLOCKED_USERS || '' }}
          GH_AW_TRUSTED_USERS_EXTRA: github-actions[bot]
          GH_AW_TRUSTED_USERS_VAR: ${{ vars.GH_AW_GITHUB_TRUSTED_USERS || '' }}
          GH_AW_APPROVAL_LABELS_VAR: ${{ vars.GH_AW_GITHUB_APPROVAL_LABELS || '' }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/parse_guard_list.sh"
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outputs.checked_out == 'true'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - env:
          AGENTIC_REASONING_EFFORT: ${{ vars.CONTENT_VERIFICATION_REASONING_EFFORT }}
        name: Validate required reasoning effort
        run: node .github/scripts/agentic-workflows/preflight.ts
      - name: Install floating external review Skills
        run: npx --yes skills@latest add mattpocock/skills --agent github-copilot --skill codebase-design tdd writing-for-agents --copy --yes --full-depth
      - env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        name: Install the trusted checked-out knowledge-base plugin
        run: |
          copilot plugin marketplace add "$GITHUB_WORKSPACE"
          copilot plugin install knowledge-base@knowledge-base
          copilot plugin list
      - name: Remove and verify Git credentials before Agent
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/clean_git_credentials.sh"
          bash .github/scripts/agentic-workflows/verify-git-credentials-removed.sh "$GITHUB_WORKSPACE" /tmp/gh-aw
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
          version: latest
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - env:
          CONTENT_VERIFICATION_SCOPE: evergreen-knowledge
          CONTENT_VERIFICATION_TARGET_MANIFEST: ${{ runner.temp }}/gh-aw/content-verification-targets.json
        name: Generate content verification target manifest
        run: node .github/scripts/content-verification-cli/prepare-agentic.ts

      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.29.11@sha256:8774a73c351395b41d2ad0af4ddb4689007c67de3cd08bd9f43bb8a0e300690e ghcr.io/github/gh-aw-firewall/api-proxy:0.29.11@sha256:88d2d0e315a504d93fd4fb8847fd0f6b7f4469f41a6fc6047b3dc9654c56ab2c ghcr.io/github/gh-aw-firewall/squid:0.29.11@sha256:861739ecf924dd2db5e5fb652db2ad82aaafd1615623297ddabc8f41a36b2847 ghcr.io/github/gh-aw-mcpg:v0.5.6@sha256:342cd624e1f179d91be2de7a146fc4f387092e62e6c8a47506d7932e113d2311 ghcr.io/github/gh-aw-node@sha256:8735428c2d4e602f90781ba0c571c400e8ff93c7ee1508a75d71f87e34e415cc ghcr.io/github/github-mcp-server:v2.1.0@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_FILE_ROOT: "${{ runner.temp }}/gh-aw"
          GH_AW_FILE_CONFIG: "{\"files\":[{\"path\":\"safeoutputs/config.json\",\"content_env\":\"GH_AW_SAFE_OUTPUTS_CONFIG\"}]}"
